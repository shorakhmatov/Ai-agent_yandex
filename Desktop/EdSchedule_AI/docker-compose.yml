services:
  db:
    image: mysql:8.4
    container_name: edschedule_mysql
    restart: always
    environment:
      MYSQL_DATABASE: edschedule_db
      MYSQL_USER: edschedule_user
      MYSQL_PASSWORD: edschedule_password
      MYSQL_ROOT_PASSWORD: root_password_edschedule
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: edschedule_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edschedule_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DB_NAME=edschedule_db
      - DB_USER=edschedule_user
      - DB_PASSWORD=edschedule_password
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db
      - redis

volumes:
  mysql_data:
